name: Windows 安装包

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - shell: pwsh
        run: |
          $nodeZip = "$env:RUNNER_TEMP\node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.14.0/node-v24.14.0-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip "$env:RUNNER_TEMP\node"
          "CPE_NODE_RUNTIME=$env:RUNNER_TEMP\node\node-v24.14.0-win-x64\node.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 构建桌面资源
        env:
          # 仅用于 Next.js 构建期静态分析；安装后由 Tauri 首次启动生成真实密钥。
          JWT_SECRET: build-only-jwt-secret-change-at-runtime
          ADMIN_PASSWORD: build-only-admin-password
          CPE_SESSION_SECRET: build-only-session-secret-change-at-runtime
          CPE_CONFIG_SECRET: build-only-config-secret-change-at-runtime
        run: npm run build:desktop
      - run: npx --yes @tauri-apps/cli@2 build
      - name: 安装并启动验收
        shell: pwsh
        run: ./scripts/test-desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CPEye-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
