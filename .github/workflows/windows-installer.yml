name: Windows 原生安装包

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: 安装 NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - shell: pwsh
        run: |
          $nodeZip = "$env:RUNNER_TEMP\node.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.14.0/node-v24.14.0-win-x64.zip" -OutFile $nodeZip
          Expand-Archive $nodeZip "$env:RUNNER_TEMP\node"
          "CPE_NODE_RUNTIME=$env:RUNNER_TEMP\node\node-v24.14.0-win-x64\node.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: 构建 CPE Monitor 原生安装包
        env:
          # 仅供 Next.js 构建期分析；安装后的运行密钥由原生宿主生成。
          JWT_SECRET: build-only-jwt-secret-change-at-runtime
          ADMIN_PASSWORD: build-only-admin-password
          CPE_SESSION_SECRET: build-only-session-secret-change-at-runtime
          CPE_CONFIG_SECRET: build-only-config-secret-change-at-runtime
        shell: pwsh
        run: ./scripts/build-native.ps1
      - name: 原生隔离验收
        shell: pwsh
        run: ./scripts/test-native.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CPEMonitor-Windows-installer
          path: installers/CPEMonitor_0.3.0_x64-setup.exe
          if-no-files-found: error
