[package]
name = "cpeye-desktop"
version = "0.1.1"
description = "CPEye Windows desktop shell"
authors = ["CPEye"]
edition = "2021"

[lib]
name = "cpeye_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
