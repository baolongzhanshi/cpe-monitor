<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CPEye 正在启动</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101418; color: #e7edf3; }
      main { width: min(420px, calc(100vw - 48px)); text-align: center; }
      .mark { width: 56px; height: 56px; margin: 0 auto 24px; border-radius: 16px; background: #28b6c7; display: grid; place-items: center; font-size: 28px; font-weight: 700; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0; color: #9eabb7; font-size: 14px; }
      .bar { height: 4px; margin: 26px auto 0; overflow: hidden; border-radius: 99px; background: #27323b; }
      .bar::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: #28b6c7; animation: load 1.4s ease-in-out infinite; }
      @keyframes load { 0% { transform: translateX(-110%); } 50%, 100% { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">C</div>
      <h1>CPEye 正在启动</h1>
      <p id="status">正在准备本地监控服务…</p>
      <div class="bar" aria-hidden="true"></div>
    </main>
    <script>
      const status = document.getElementById('status');
      const healthUrl = 'http://127.0.0.1:3210/api/system/health';
      let attempts = 0;
      async function waitForServer() {
        attempts += 1;
        try {
          // 启动页与本地服务不同源，只检查服务能否接受连接。
          await fetch(healthUrl, { cache: 'no-store', mode: 'no-cors', signal: AbortSignal.timeout(2000) });
          window.location.replace('http://127.0.0.1:3210/login');
          return;
        } catch (_) {
          // 本地服务启动期间连接失败是正常状态。
        }
        if (attempts > 120) {
          status.textContent = '本地服务启动失败，请从托盘退出 CPEye 后重新打开。';
          return;
        }
        if (attempts > 30) status.textContent = '服务启动时间较长，请稍候…';
        window.setTimeout(waitForServer, attempts > 30 ? 1000 : 500);
      }
      waitForServer();
    </script>
  </body>
</html>
